name: Sync release from Loyalsoldier

on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recipe
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and verify artifacts
        env:
          UPSTREAM: https://raw.githubusercontent.com/Loyalsoldier/geoip/release
        run: |
          set -euo pipefail
          mkdir -p release-out
          files="Country.mmdb Country-asn.mmdb geoip-asn.dat"
          for f in $files; do
            curl -fsSL "$UPSTREAM/$f" -o "release-out/$f"
            curl -fsSL "$UPSTREAM/$f.sha256sum" -o "release-out/$f.sha256sum"
            (cd release-out && sha256sum -c "$f.sha256sum")
          done

      - name: Publish release branch
        run: |
          set -euo pipefail
          git checkout --orphan release-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p publish
          mv release-out/* publish/
          find . -mindepth 1 -maxdepth 1 ! -name publish ! -name .git -exec rm -rf {} +
          mv publish/* .
          rmdir publish
          git add Country.mmdb Country.mmdb.sha256sum Country-asn.mmdb Country-asn.mmdb.sha256sum geoip-asn.dat geoip-asn.dat.sha256sum
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "no artifact changes"
          else
            git commit -m "sync Loyalsoldier release artifacts"
          fi
          git branch -M release
          git push --force origin release
